[package]
name = "disk-ledger"
version = "0.1.0"
edition = "2021"

[dependencies]
hashbrown = "0.17"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
