# NILFS2 garbage collector. Passed explicitly with `nilfs_cleanerd -c`; deliberately not in /etc,
# so nothing starts a collector implicitly under the retain-everything policy.

# Checkpoints younger than this are never collected.
protection_period	86400

cleaning_interval	5
nsegments_per_clean	4

# Segments with less reclaimable space than this are left alone, so a mostly-live
# filesystem costs nothing to scan.
min_reclaimable_blocks	10%

# The "mc_" variants apply when the filesystem is short of space.
mc_cleaning_interval	1
mc_nsegments_per_clean	4
mc_min_reclaimable_blocks	1%

retry_interval	60
use_set_suinfo
use_mmap
log_priority	info
