[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookshelf"
version = "0.1.0"
description = "Catalogue of books and sheet music, with edition identification and valuation"
requires-python = ">=3.12"
dependencies = [
  "starlette",
  "python-multipart",
  "uvicorn",
  "jinja2",
  "httpx",
  "pydantic",
  "isbnlib",
  "pymarc",
  "selectolax",
  "musicbrainzngs",
]

[project.optional-dependencies]
model = ["numpy", "statsmodels"]

[project.scripts]
bookshelf = "bookshelf.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookshelf = ["templates/*.html", "static/*"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["bookshelf"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["isbnlib.*", "pymarc.*", "selectolax.*", "musicbrainzngs.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
