<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Bookshelf{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="tabs">
  <a href="/add" class="{{ 'on' if active == 'add' }}">Add</a>
  <a href="/browse" class="{{ 'on' if active == 'browse' }}">Browse</a>
  <a href="/search" class="{{ 'on' if active == 'search' }}">Search</a>
  <a href="/valuation" class="{{ 'on' if active == 'valuation' }}">Value</a>
  <a href="/sql" class="{{ 'on' if active == 'sql' }}">Query</a>
</nav>

<main>
{% block body %}{% endblock %}
</main>

<footer>
  <span>{{ identity }}</span>
  <a href="/health">status</a>
</footer>
<script src="/static/app.js" defer></script>
</body>
</html>
