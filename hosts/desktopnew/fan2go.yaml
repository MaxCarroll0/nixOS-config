tempSensorPollingRate: 2s
tempRollingWindowSize: 12

sensors:
  - id: cpu
    hwmon:
      platform: zenpower
      index: 1

curves:
  - id: cpu_curve
    linear:
      sensor: cpu
      steps:
        - 50: 00%
        - 60: 10%
        - 70: 20%
        - 75: 50%
        - 80: 100%

fans:
  - id: cpu_fan
    hwmon:
      platform: it8792
      rpmChannel: 1
      pwmChannel: 1
    neverStop: true
    curve: cpu_curve
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    controlMode:
      onExit: restore
    minPwm: 0
    startPwm: 40
    maxPwm: 255
