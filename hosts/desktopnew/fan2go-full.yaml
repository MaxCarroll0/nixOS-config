tempSensorPollingRate: 2s
tempRollingWindowSize: 12

sensors:
  - id: cpu
    hwmon:
      platform: zenpower
      index: 1

  - id: case
    cmd:
      exec: /run/current-system/sw/bin/case-temp-millicelsius

curves:
  # 32-thread load holds 60C with this fan at its 601rpm floor, so it stays there.
  - id: radiator_curve
    linear:
      sensor: cpu
      steps:
        - 70: 0%
        - 78: 30%
        - 85: 60%
        - 92: 100%

  - id: pump_curve
    linear:
      sensor: cpu
      steps:
        - 70: 55%
        - 80: 75%
        - 90: 100%

  # VRM MOS settles at 82C under sustained all-core load with these fans stopped,
  # and the CPU holds 107W throughout, so that is not a throttling point.
  - id: intake_vertical_curve
    linear:
      sensor: case
      steps:
        - 82: 0%
        - 88: 35%
        - 94: 70%
        - 100: 100%

  - id: intake_horizontal_curve
    linear:
      sensor: case
      steps:
        - 82: 0%
        - 88: 35%
        - 94: 70%
        - 100: 100%

  - id: extract_curve
    linear:
      sensor: case
      steps:
        - 35: 18%
        - 55: 25%
        - 70: 40%
        - 80: 70%
        - 88: 100%

fans:
  - id: radiator
    hwmon:
      platform: it8792
      rpmChannel: 1
      pwmChannel: 1
    curve: radiator_curve
    neverStop: false
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 2
    controlMode:
      onExit: restore
    minPwm: 0
    startPwm: 40
    maxPwm: 255

  - id: pump
    hwmon:
      platform: it8792
      rpmChannel: 2
      pwmChannel: 2
    curve: pump_curve
    neverStop: true
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    controlMode:
      onExit: restore
    minPwm: 140
    startPwm: 120
    maxPwm: 230

  - id: intake_vertical
    hwmon:
      platform: arctic_fan
      rpmChannel: 2
      pwmChannel: 2
    curve: intake_vertical_curve
    neverStop: false
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    minPwm: 0
    startPwm: 20
    maxPwm: 255

  - id: intake_horizontal
    hwmon:
      platform: arctic_fan
      rpmChannel: 6
      pwmChannel: 6
    curve: intake_horizontal_curve
    neverStop: false
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    minPwm: 0
    startPwm: 20
    maxPwm: 255

  # The fan fitted here is 3-pin, and the ARCTIC hub is PWM-only (its driver
  # exposes no pwm_mode), so this curve has no effect until a 4-pin fan is
  # fitted; the fan runs at a constant ~1300 rpm.
  - id: extract
    hwmon:
      platform: arctic_fan
      rpmChannel: 3
      pwmChannel: 3
    curve: extract_curve
    neverStop: true
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    minPwm: 30
    startPwm: 45
    maxPwm: 255
