tempSensorPollingRate: 2s
tempRollingWindowSize: 12

# The ARCTIC hub and amdgpu tachs jitter ~30 rpm, so at the default of 20
# waitForFanToSettle never exits and those fans never finish initialising.
maxRpmDiffForSettledFan: 100

sensors:
  - id: cpu
    hwmon:
      platform: zenpower
      index: 1

  - id: vrm
    hwmon:
      platform: gigabyte_wmi
      index: 5

  - id: gpu
    hwmon:
      platform: amdgpu
      index: 1

  - id: ambient
    hwmon:
      platform: gigabyte_wmi
      index: 1

curves:
  # 32-thread load holds 60C with this fan at its 601 rpm floor, so it stays
  # there. Flat below 70C also makes single-core boost spikes invisible to it.
  - id: radiator_curve
    linear:
      sensor: cpu
      steps:
        - 70: 0%
        - 78: 50%
        - 86: 100%

  # Percentages scale over minPwm..maxPwm, so 0% here is pwm 140: Tdie is flat
  # from 2812 down to 1951 rpm, then rises 8.6C at pwm 100 as the pump cavitates.
  - id: pump_curve
    linear:
      sensor: cpu
      steps:
        - 70: 0%
        - 80: 60%
        - 88: 100%

  - id: intake_vertical_curve
    linear:
      sensor: ambient
      steps:
        - 32: 0%
        - 36: 35%
        - 40: 75%
        - 44: 100%

  - id: intake_horizontal_curve
    linear:
      sensor: ambient
      steps:
        - 32: 0%
        - 36: 35%
        - 40: 75%
        - 44: 100%

  - id: extract_curve
    linear:
      sensor: ambient
      steps:
        - 32: 0%
        - 36: 35%
        - 40: 75%
        - 44: 100%

  # Airflow above this fan's ~400 rpm floor barely moves VRM MOS (identical at
  # 380 and 2169 rpm), but without the fan entirely it reaches 105C.

  - id: vrm_curve
    linear:
      sensor: vrm
      steps:
        - 66: 0%
        - 74: 30%
        - 80: 60%
        - 88: 100%

  # The card's own curve parks at 790 rpm, sits at 89C under 119W and throttles
  # to 108W. Measured: pwm 128 -> 75C, pwm 180 -> 67C, both at full power.
  - id: gpu_curve
    linear:
      sensor: gpu
      steps:
        - 50: 0%
        - 60: 25%
        - 70: 45%
        - 78: 70%
        - 85: 100%

fans:
  - id: radiator
    hwmon:
      platform: it8792
      rpmChannel: 1
      pwmChannel: 1
    curve: radiator_curve
    neverStop: false
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 2
    controlMode:
      onExit: restore
    minPwm: 0
    startPwm: 40
    maxPwm: 255

  - id: pump
    hwmon:
      platform: it8792
      rpmChannel: 2
      pwmChannel: 2
    curve: pump_curve
    neverStop: true
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    controlMode:
      onExit: restore
    minPwm: 140
    startPwm: 150
    maxPwm: 230

  - id: intake_vertical
    hwmon:
      platform: arctic_fan
      rpmChannel: 2
      pwmChannel: 2
    curve: intake_vertical_curve
    neverStop: false
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    minPwm: 0
    startPwm: 20
    maxPwm: 255

  - id: intake_horizontal
    hwmon:
      platform: arctic_fan
      rpmChannel: 6
      pwmChannel: 6
    curve: intake_horizontal_curve
    neverStop: false
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    minPwm: 0
    startPwm: 20
    maxPwm: 255

  # This fan will not stop: it holds ~400 rpm at pwm 0.
  - id: vrm_fan
    hwmon:
      platform: arctic_fan
      rpmChannel: 7
      pwmChannel: 7
    curve: vrm_curve
    neverStop: true
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 8
    minPwm: 0
    startPwm: 40
    maxPwm: 255

  - id: gpu_fan
    hwmon:
      platform: amdgpu
      rpmChannel: 1
      pwmChannel: 1
    curve: gpu_curve
    neverStop: false
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    controlMode:
      onExit: restore
    minPwm: 0
    startPwm: 40
    maxPwm: 255

  # The fan fitted here is 3-pin, and the ARCTIC hub is PWM-only (its driver
  # exposes no pwm_mode), so this curve has no effect until a 4-pin fan is
  # fitted; the fan runs at a constant ~1300 rpm.
  - id: extract
    hwmon:
      platform: arctic_fan
      rpmChannel: 3
      pwmChannel: 3
    curve: extract_curve
    neverStop: true
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    minPwm: 30
    startPwm: 45
    maxPwm: 255
