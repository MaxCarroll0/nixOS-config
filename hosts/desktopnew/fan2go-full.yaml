tempSensorPollingRate: 2s
tempRollingWindowSize: 12

sensors:
  - id: cpu
    hwmon:
      platform: zenpower
      index: 1

  - id: vrm
    hwmon:
      platform: gigabyte_wmi
      index: 5

  - id: case
    cmd:
      exec: /run/current-system/sw/bin/case-temp-millicelsius

curves:
  - id: radiator_curve
    linear:
      sensor: cpu
      steps:
        - 40: 20%
        - 60: 35%
        - 70: 60%
        - 80: 100%

  - id: pump_curve
    linear:
      sensor: cpu
      steps:
        - 30: 40%
        - 60: 60%
        - 80: 100%

  - id: intake_vertical_curve
    linear:
      sensor: case
      steps:
        - 42: 20%
        - 58: 32%
        - 70: 58%
        - 84: 100%

  - id: intake_horizontal_curve
    linear:
      sensor: case
      steps:
        - 45: 20%
        - 60: 30%
        - 72: 55%
        - 85: 100%

  - id: extract_curve
    linear:
      sensor: case
      steps:
        - 35: 18%
        - 55: 25%
        - 70: 40%
        - 80: 70%
        - 88: 100%

  - id: vrm_curve
    linear:
      sensor: vrm
      steps:
        - 45: 20%
        - 60: 40%
        - 75: 70%
        - 85: 100%

fans:
  - id: radiator
    hwmon:
      platform: it8792
      rpmChannel: 1
      pwmChannel: 1
    curve: radiator_curve
    neverStop: true
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    controlMode:
      onExit: restore
    minPwm: 40
    startPwm: 60
    maxPwm: 255

  - id: pump
    hwmon:
      platform: it8792
      rpmChannel: 2
      pwmChannel: 2
    curve: pump_curve
    neverStop: true
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    controlMode:
      onExit: restore
    minPwm: 100
    startPwm: 120
    maxPwm: 230

  - id: intake_vertical
    hwmon:
      platform: arctic_fan
      rpmChannel: 2
      pwmChannel: 2
    curve: intake_vertical_curve
    neverStop: false
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    minPwm: 0
    startPwm: 45
    maxPwm: 255

  - id: intake_horizontal
    hwmon:
      platform: arctic_fan
      rpmChannel: 6
      pwmChannel: 6
    curve: intake_horizontal_curve
    neverStop: false
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    minPwm: 0
    startPwm: 45
    maxPwm: 255

  - id: vrm_fan
    hwmon:
      platform: arctic_fan
      rpmChannel: 7
      pwmChannel: 7
    curve: vrm_curve
    neverStop: false
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 8
    minPwm: 0
    startPwm: 45
    maxPwm: 255

  # The fan fitted here is 3-pin, and the ARCTIC hub is PWM-only (its driver
  # exposes no pwm_mode), so this curve has no effect until a 4-pin fan is
  # fitted; the fan runs at a constant ~1330 rpm.
  - id: extract
    hwmon:
      platform: arctic_fan
      rpmChannel: 3
      pwmChannel: 3
    curve: extract_curve
    neverStop: true
    controlAlgorithm:
      direct:
        maxPwmChangePerCycle: 5
    minPwm: 30
    startPwm: 45
    maxPwm: 255
